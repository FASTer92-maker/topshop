      copyright: "© %{year} TopShop · Учебный проект"
      region: Россия · Русский
      sections:
        help:
          title: Помощь
          items:
            - Вопросы и ответы
            - Доставка и оплата
            - Возврат и обмен
            - Контакты
        shop:
          title: Магазин
          items:
            - О нас
            - Адреса магазинов
        documents:
          title: Документы
          items:
            - Политика конфиденциальности
            - Пользовательское соглашение
