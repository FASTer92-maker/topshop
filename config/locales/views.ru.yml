      default_title: TopShop — одежда на каждый день
      skip_to_content: Перейти к содержимому
    promo_bar:
      message: Бесплатная доставка от 10 000 ₽
    header:
      logo: TopShop
      logo_label: TopShop — на главную
      main_nav: Основное меню
      all: Все
      search: Поиск
      search_placeholder: Поиск товаров
      search_submit: Найти
      sign_in: Войти
      favorites: Избранное
      cart:
        one: Корзина (%{count})
        few: Корзина (%{count})
        many: Корзина (%{count})
        other: Корзина (%{count})
