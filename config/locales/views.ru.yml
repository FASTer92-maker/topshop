      logo_label: TopShop — на главную
      main_nav: Основное меню
      all: Все
      search: Поиск
      search_placeholder: Поиск товаров
      search_submit: Найти
      sign_in: Войти
      favorites: Избранное
      cart:
        one: Корзина (%{count})
        few: Корзина (%{count})
        many: Корзина (%{count})
        other: Корзина (%{count})
    account_menu:
      admin: Админ-панель
      sign_out: Выйти
    flash:
      close: Закрыть
